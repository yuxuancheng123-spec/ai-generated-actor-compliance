name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests (backend, CLI, and JS/backend engine parity)
        run: python -m pytest -q tests scripts
      - name: Check generated web rules are current
        run: |
          python scripts/build_web_rules.py
          git diff --exit-code web/rules-data.js
